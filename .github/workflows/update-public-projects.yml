name: Update public project index

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update generated repository index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTFOLIO_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/update_public_projects.py

      - name: Commit when repository metadata changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Public repository index is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync public repository index"
          git push
