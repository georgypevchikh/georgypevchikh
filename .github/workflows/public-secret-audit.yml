name: Audit public repositories for secrets

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      repositories: ${{ steps.repos.outputs.repositories }}
    steps:
      - id: repos
        name: Discover current public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repositories="$(
            gh api --paginate \
              "users/${GITHUB_REPOSITORY_OWNER}/repos?type=owner&per_page=100" \
              --slurp \
            | jq -c '[.[][] | select(.private == false and .fork == false and .archived == false) | .full_name]'
          )"
          echo "repositories=${repositories}" >> "$GITHUB_OUTPUT"

  scan:
    needs: inventory
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJson(needs.inventory.outputs.repositories) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          fetch-depth: 0

      - name: Scan full git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
